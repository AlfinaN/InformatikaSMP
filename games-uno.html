<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Array Kartu UNO</title>
    <style>
      /* Menggunakan font dasar agar bersih dan mudah dibaca */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #2c3e50;
        color: #ecf0f1;
        margin: 0;
        padding: 20px;
        text-align: center;
      }

      h1 {
        color: #f1c40f;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 5px;
      }

      p.subtitle {
        margin-top: 0;
        color: #bdc3c7;
        font-size: 16px;
      }

      /* Panel Kontrol Atas */
      .control-panel {
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 12px;
        display: inline-block;
        margin-bottom: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .control-panel label {
        font-size: 18px;
        font-weight: bold;
        margin-right: 10px;
      }

      .control-panel input {
        font-size: 18px;
        padding: 5px 10px;
        width: 60px;
        border: 2px solid #34495e;
        border-radius: 6px;
        text-align: center;
        font-weight: bold;
      }

      .btn {
        font-size: 16px;
        font-weight: bold;
        padding: 10px 20px;
        margin: 0 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
        text-transform: uppercase;
      }

      .btn-start {
        background-color: #e74c3c;
        color: white;
        text-decoration: none;
      }
      .btn-start:hover {
        background-color: #c0392b;
      }

      .btn-answer {
        background-color: #2ecc71;
        color: white;
        display: none;
      }
      .btn-answer:hover {
        background-color: #27ae60;
      }

      /* Area Kartu */
      .board {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
        min-height: 200px;
      }

      .board-title {
        width: 100%;
        font-size: 24px;
        margin-bottom: 10px;
        color: #f39c12;
        display: none;
      }

      /* Desain Kartu UNO */
      .card-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: popIn 0.5s ease-out forwards;
        opacity: 0;
        transform: scale(0.5);
      }

      .uno-card {
        width: 120px;
        height: 180px;
        border-radius: 12px;
        border: 5px solid white;
        box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        user-select: none;
      }

      /* Lingkaran putih di tengah kartu */
      .uno-inner {
        width: 80%;
        height: 90%;
        background-color: white;
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        transform: rotate(-20deg);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
      }

      .uno-number {
        font-size: 60px;
        font-weight: 900;
        font-style: italic;
        transform: rotate(20deg);
        text-shadow:
          2px 2px 0px white,
          -2px -2px 0px white;
      }

      /* Angka kecil di pojok */
      .corner-num {
        position: absolute;
        font-size: 20px;
        font-weight: bold;
        color: white;
        font-style: italic;
      }
      .top-left {
        top: 5px;
        left: 10px;
      }
      .bottom-right {
        bottom: 5px;
        right: 10px;
        transform: rotate(180deg);
      }

      /* Label Indeks di bawah kartu */
      .index-label {
        margin-top: 10px;
        background-color: #34495e;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 16px;
        font-weight: bold;
        border: 2px solid #7f8c8d;
      }

      .highlight-index {
        background-color: #f1c40f;
        color: #2c3e50;
        border-color: #f39c12;
        animation: pulse 1.5s infinite;
      }

      /* Animasi */
      @keyframes popIn {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Warna Kartu Klasik */
      .Merah {
        background-color: #c0392b;
      }
      .Merah .uno-number {
        color: #c0392b;
      }

      .Kuning {
        background-color: #f1c40f;
      }
      .Kuning .uno-number {
        color: #f1c40f;
      }

      .Hijau {
        background-color: #27ae60;
      }
      .Hijau .uno-number {
        color: #27ae60;
      }

      .Biru {
        background-color: #2980b9;
      }
      .Biru .uno-number {
        color: #2980b9;
      }
    </style>
  </head>
  <div class="header">
    <a href="index.html" class="btn btn-start">🔙 Kembali</a>
  </div>
  <body>
    <h1>🃏 Tantangan Lab: Array Kartu UNO</h1>
    <p class="subtitle">
      Buat Array di layarmu, salin ke buku, lalu urutkan sesuai abjad warna dan
      angkanya!
    </p>

    <!-- Panel Kontrol -->
    <div class="control-panel">
      <label for="cardCount">Jumlah Kartu (Maks 36): </label>
      <input type="number" id="cardCount" min="3" max="36" value="5" />
      <button class="btn btn-start" onclick="mulaiGame()">Acak Kartu!</button>
      <button
        class="btn btn-answer"
        id="btnAnswer"
        onclick="tampilkanJawaban()"
      >
        Tampilkan Kunci Jawaban
      </button>
    </div>

    <!-- Papan untuk Kartu Acak (Soal) -->
    <div class="board" id="boardAcak">
      <div class="board-title" id="titleAcak">❓ Kartu Acak (Soal)</div>
      <!-- Kartu akan dirender di sini via JS -->
    </div>

    <hr
      style="border-color: #7f8c8d; margin: 40px 0; display: none"
      id="divider"
    />

    <!-- Papan untuk Kartu Terurut (Jawaban) -->
    <div class="board" id="boardUrut">
      <div class="board-title" id="titleUrut">
        ✅ Kunci Jawaban (Array Terurut)
      </div>
      <!-- Kartu akan dirender di sini via JS -->
    </div>

    <script>
      // Data dasar kartu UNO
      const warnaUNO = ["Merah", "Kuning", "Hijau", "Biru"];
      const angkaUNO = [1, 2, 3, 4, 5, 6, 7, 8, 9];

      let deckLengkap = [];
      let kartuTarik = [];

      // Inisialisasi membuat 36 kartu (4 warna x 9 angka)
      function buatDeck() {
        deckLengkap = [];
        for (let w of warnaUNO) {
          for (let a of angkaUNO) {
            deckLengkap.push({ warna: w, angka: a });
          }
        }
      }

      // Mengacak urutan array (Algoritma Fisher-Yates)
      function acakArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      // Fungsi utama saat tombol "Acak Kartu" ditekan
      function mulaiGame() {
        const input = document.getElementById("cardCount");
        let jumlah = parseInt(input.value);

        // Validasi input
        if (jumlah < 1) jumlah = 1;
        if (jumlah > 36) jumlah = 36;
        input.value = jumlah;

        buatDeck();
        acakArray(deckLengkap);

        // Ambil sejumlah kartu sesuai request
        kartuTarik = deckLengkap.slice(0, jumlah);

        // Reset UI
        document.getElementById("boardUrut").innerHTML =
          '<div class="board-title" id="titleUrut">✅ Kunci Jawaban (Array Terurut)</div>';
        document.getElementById("divider").style.display = "none";
        document.getElementById("titleUrut").style.display = "none";

        // Render kartu acak
        renderKartu(kartuTarik, "boardAcak", "titleAcak", false);

        // Tampilkan tombol jawaban
        document.getElementById("btnAnswer").style.display = "inline-block";
      }

      // Fungsi saat tombol "Kunci Jawaban" ditekan
      function tampilkanJawaban() {
        // Logika Pengurutan:
        // 1. Sort berdasarkan Abjad Warna (Biru, Hijau, Kuning, Merah)
        // 2. Jika warna sama, Sort berdasarkan Angka (Kecil ke Besar)
        let kartuUrut = [...kartuTarik];

        kartuUrut.sort((a, b) => {
          // localeCompare otomatis mengurutkan abjad: B, H, K, M
          let bandingWarna = a.warna.localeCompare(b.warna);
          if (bandingWarna !== 0) {
            return bandingWarna;
          } else {
            // Jika warna sama, bandingkan angka
            return a.angka - b.angka;
          }
        });

        // Tampilkan pembatas dan render kartu terurut
        document.getElementById("divider").style.display = "block";
        renderKartu(kartuUrut, "boardUrut", "titleUrut", true);

        // Sembunyikan tombol jawaban agar fokus ke layar
        document.getElementById("btnAnswer").style.display = "none";
      }

      // Fungsi untuk menggambar kartu ke HTML
      function renderKartu(arrayKartu, elemenId, titleId, tampilkanIndeks) {
        const wadah = document.getElementById(elemenId);

        // Bersihkan isi wadah (kecuali judul)
        wadah.innerHTML = `<div class="board-title" id="${titleId}" style="display: block;">${document.getElementById(titleId).innerHTML}</div>`;

        // Render tiap kartu dengan jeda animasi (Staggered Animation)
        arrayKartu.forEach((kartu, index) => {
          const delay = index * 0.1; // Efek muncul satu per satu

          // Menentukan apakah ini indeks 0 atau 3 yang ditanyakan di challenge
          const isHighlight = index === 0 || index === 3;
          const classLabel = isHighlight
            ? "index-label highlight-index"
            : "index-label";

          // HTML untuk satu kartu
          const cardHTML = `
                    <div class="card-container" style="animation-delay: ${delay}s">
                        <div class="uno-card ${kartu.warna}">
                            <span class="corner-num top-left">${kartu.angka}</span>
                            <div class="uno-inner">
                                <span class="uno-number">${kartu.angka}</span>
                            </div>
                            <span class="corner-num bottom-right">${kartu.angka}</span>
                        </div>
                        ${tampilkanIndeks ? `<div class="${classLabel}">Indeks: ${index}</div>` : ""}
                    </div>
                `;

          wadah.innerHTML += cardHTML;
        });
      }
    </script>
  </body>
</html>
