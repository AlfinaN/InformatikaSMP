<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster Edukasi - BIMITS</title>
    <style>
      /* CSS ini agar presentasinya penuh (fullscreen) di layar HP atau TV */
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #000; /* Latar belakang hitam */
      }
      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <!-- PASTE KODE DARI GOOGLE SLIDES DI BAWAH BARIS INI -->

    <iframe
      src="https://docs.google.com/presentation/d/e/2PACX-1vSGbuc0wHDhtBsQb5o_1bh2bEfp6SBiDb5gZaFtYKfVnavpgeA5Be5PnIzGcjVjCw/pubembed?start=false&loop=false&delayms=3000"
      frameborder="0"
      width="1920"
      height="1109"
      allowfullscreen="true"
      mozallowfullscreen="true"
      webkitallowfullscreen="true"
    ></iframe>

    <!-- PASTE KODE DARI GOOGLE SLIDES DI ATAS BARIS INI -->
  </body>
</html>
