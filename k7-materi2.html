<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berpikir Komputasional - Kelas 7</title>
    <style>
      /* Desain layout agar layar penuh tanpa scroll */
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        background-color: #222;
      }

      /* Bar navigasi di bagian atas */
      .header {
        background-color: #111;
        padding: 10px 20px;
        display: flex;
        align-items: center;
      }

      .btn-back {
        color: white;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-size: 14px;
        background-color: #444;
        padding: 8px 15px;
        border-radius: 5px;
        transition: 0.2s;
      }
      .btn-back:hover {
        background-color: #666;
      }

      .judul-materi {
        color: white;
        font-family: Arial, sans-serif;
        margin-left: 20px;
        font-size: 16px;
      }

      /* Area untuk Google Slides mengambil sisa ruang di layar */
      .slide-container {
        flex-grow: 1;
        width: 100%;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <!-- Barisan Atas: Tombol Back -->
    <div class="header">
      <!-- Link ini akan membawa murid kembali ke menu Kelas 7 -->
      <a href="kelas-7.html" class="btn-back">🔙 Kembali</a>
      <span class="judul-materi">Materi 2: Berpikir Komputasional</span>
    </div>

    <!-- Bagian Bawah: Isi Slide -->
    <div class="slide-container">
      <!-- PASTE KODE EMBED GOOGLE SLIDES DI BAWAH INI -->

      <iframe
        src="https://docs.google.com/presentation/d/e/2PACX-1vSGbuc0wHDhtBsQb5o_1bh2bEfp6SBiDb5gZaFtYKfVnavpgeA5Be5PnIzGcjVjCw/pubembed?start=false&loop=false&delayms=3000"
        frameborder="0"
        allowfullscreen="true"
        mozallowfullscreen="true"
        webkitallowfullscreen="true"
      ></iframe>
    </div>
  </body>
</html>
